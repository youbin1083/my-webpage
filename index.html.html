<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F3FF;
    --surface: #FFFFFF;
    --line: #E6E0FA;
    --text: #241C3B;
    --text-muted: #948FB0;
    --violet: #6E4CFA;
    --violet-deep: #4B2FD1;
    --lime: #C6F24E;
    --pink: #FF6FA5;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body{
    background: var(--bg);
    background-image:
      radial-gradient(600px 500px at 8% -8%, rgba(198,242,78,0.55), transparent 60%),
      radial-gradient(650px 550px at 100% 15%, rgba(110,76,250,0.28), transparent 55%),
      radial-gradient(500px 450px at 15% 105%, rgba(255,111,165,0.25), transparent 55%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  main{
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- 시계 / 날짜 ---------- */
  .clock-block{
    text-align: center;
    margin-bottom: 34px;
  }

  .clock{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(58px, 13vw, 92px);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--violet-deep);
  }

  .clock .colon{
    color: var(--pink);
  }

  .clock .ampm{
    font-size: 0.26em;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.01em;
    margin-right: 6px;
    vertical-align: 12%;
  }

  .date-pill{
    display: inline-block;
    margin-top: 16px;
    padding: 7px 16px;
    background: var(--lime);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: #2B3300;
    letter-spacing: 0.01em;
  }

  /* ---------- 검색 ---------- */
  .search-block{
    width: 100%;
    margin-bottom: 28px;
  }

  .search-form{
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 14px 10px 14px 20px;
    box-shadow: 0 8px 24px rgba(110,76,250,0.10);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .search-form:focus-within{
    border-color: var(--violet);
    box-shadow: 0 8px 28px rgba(110,76,250,0.22);
  }

  .search-icon{
    flex-shrink: 0;
    margin-right: 12px;
  }

  .search-input{
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
  }

  .search-input::placeholder{
    color: var(--text-muted);
    font-weight: 400;
  }

  .search-submit{
    flex-shrink: 0;
    background: var(--violet);
    border: none;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 9px 18px;
    border-radius: 999px;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .search-submit:hover{
    background: var(--violet-deep);
    transform: translateY(-1px);
  }

  /* ---------- 할 일 ---------- */
  .todo-block{
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 28px;
    padding: 24px 22px;
    box-shadow: 0 10px 30px rgba(110,76,250,0.08);
  }

  .todo-header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .todo-title{
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .todo-count{
    font-size: 12px;
    font-weight: 600;
    color: var(--violet);
    background: #F1ECFF;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .todo-add{
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .todo-add input{
    flex: 1;
    background: #FAF8FF;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .todo-add input:focus{
    border-color: var(--violet);
  }

  .todo-add input::placeholder{
    color: var(--text-muted);
  }

  .todo-add button{
    background: var(--text);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 18px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .todo-add button:hover{
    background: var(--violet-deep);
  }

  .todo-list{
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .todo-item{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }

  .todo-item:last-child{
    border-bottom: none;
  }

  .todo-check{
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 8px;
    border: 2px solid var(--line);
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .todo-check.done{
    border-color: var(--lime);
    background: var(--lime);
  }

  .todo-check.done::after{
    content: '';
    position: absolute;
    left: 6px;
    top: 3px;
    width: 5px;
    height: 9px;
    border-right: 2px solid #2B3300;
    border-bottom: 2px solid #2B3300;
    transform: rotate(45deg);
  }

  .todo-text{
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    word-break: break-word;
  }

  .todo-text.done{
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--line);
  }

  .todo-remove{
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
    padding: 4px;
  }

  .todo-item:hover .todo-remove{
    opacity: 1;
  }

  .todo-remove:hover{
    color: var(--pink);
  }

  .todo-empty{
    padding: 20px 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<main>

  <div class="clock-block">
    <div class="clock" id="clock">--:--</div>
    <div class="date-pill" id="date">-</div>
  </div>

  <div class="search-block">
    <form class="search-form" id="searchForm">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="5.5" stroke="#948FB0" stroke-width="1.6"/>
        <line x1="11.2" y1="11.2" x2="14.5" y2="14.5" stroke="#948FB0" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input class="search-input" type="text" id="searchInput" placeholder="구글에서 검색" autocomplete="off" autofocus>
      <button class="search-submit" type="submit">검색</button>
    </form>
  </div>

  <div class="todo-block">
    <div class="todo-header">
      <span class="todo-title">오늘의 할 일</span>
      <span class="todo-count" id="todoCount">0개</span>
    </div>

    <div class="todo-add">
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" autocomplete="off">
      <button id="todoAddBtn" type="button">추가</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>
  </div>

</main>

<script>
  // ---------- 시계 / 날짜 ----------
  function pad(n){ return n.toString().padStart(2, '0'); }

  function updateClock(){
    const now = new Date();
    let hours = now.getHours();
    const ampm = hours < 12 ? '오전' : '오후';
    let displayHours = hours % 12;
    if(displayHours === 0) displayHours = 12;
    const minutes = pad(now.getMinutes());

    document.getElementById('clock').innerHTML =
      '<span class="ampm">' + ampm + '</span>' + displayHours + '<span class="colon">:</span>' + minutes;

    const dateStr = now.toLocaleDateString('ko-KR', {
      month: 'long', day: 'numeric', weekday: 'long'
    });
    document.getElementById('date').textContent = dateStr;
  }
  updateClock();
  setInterval(updateClock, 1000 * 10);

  // ---------- 검색 ----------
  document.getElementById('searchForm').addEventListener('submit', function(e){
    e.preventDefault();
    const input = document.getElementById('searchInput');
    const query = input.value.trim();
    if(!query) return;
    const url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
    window.open(url, '_blank', 'noopener,noreferrer');
  });

  // ---------- 할 일 ----------
  const STORAGE_KEY = 'my-start-page-todos';
  let todos = [];

  function loadTodos(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      todos = raw ? JSON.parse(raw) : [];
    }catch(e){
      todos = [];
    }
  }

  function saveTodos(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }catch(e){ /* 저장 실패 시 조용히 무시 */ }
  }

  function renderTodos(){
    const list = document.getElementById('todoList');
    const count = document.getElementById('todoCount');
    list.innerHTML = '';

    const remaining = todos.filter(t => !t.done).length;
    count.textContent = remaining + '개';

    if(todos.length === 0){
      const empty = document.createElement('li');
      empty.className = 'todo-empty';
      empty.textContent = '오늘 할 일을 추가해 보세요';
      list.appendChild(empty);
      return;
    }

    todos.forEach((todo, idx) => {
      const li = document.createElement('li');
      li.className = 'todo-item';

      const check = document.createElement('div');
      check.className = 'todo-check' + (todo.done ? ' done' : '');
      check.addEventListener('click', () => {
        todos[idx].done = !todos[idx].done;
        saveTodos();
        renderTodos();
      });

      const text = document.createElement('span');
      text.className = 'todo-text' + (todo.done ? ' done' : '');
      text.textContent = todo.text;

      const remove = document.createElement('button');
      remove.className = 'todo-remove';
      remove.type = 'button';
      remove.setAttribute('aria-label', '삭제');
      remove.textContent = '×';
      remove.addEventListener('click', () => {
        todos.splice(idx, 1);
        saveTodos();
        renderTodos();
      });

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(remove);
      list.appendChild(li);
    });
  }

  function addTodo(){
    const input = document.getElementById('todoInput');
    const value = input.value.trim();
    if(!value) return;
    todos.push({ text: value, done: false });
    saveTodos();
    renderTodos();
    input.value = '';
    input.focus();
  }

  document.getElementById('todoAddBtn').addEventListener('click', addTodo);
  document.getElementById('todoInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addTodo();
  });

  loadTodos();
  renderTodos();
</script>

</body>
</html>
