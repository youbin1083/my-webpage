<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>모바일 겸용 전자 도장 / 서명 이미지 생성기</title>
  
  <!-- Google Fonts - 상업적 이용 가능(OFL) 한글 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Batang&family=Black+Han+Sans&family=Dokdo&family=Gowun+Batang:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Song+Myung&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 모바일 반응형 체커보드 배경 (투명 PNG 확인용) */
    .transparent-bg {
      background-color: #f8fafc;
      background-image: 
        linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    /* 터치 스크롤 최적화 */
    .scroll-touch {
      -webkit-overflow-scrolling: touch;
    }

    /* 커스텀 스크롤바 바 */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased pb-10">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-14 sm:h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2 sm:space-x-3">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-red-600 flex items-center justify-center text-white font-bold text-lg sm:text-xl shadow-md">
          印
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">전자 도장 메이커</h1>
          <p class="text-[10px] sm:text-xs text-slate-500">교사 및 사무직용 모바일 투명 도장 생성기</p>
        </div>
      </div>
      <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-medium bg-emerald-100 text-emerald-800">
        <i class="fa-solid fa-shield-halved mr-1"></i> 무료 폰트
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-8">
      
      <!-- Right Preview & Action Panel (Mobile: First Displayed) -->
      <div class="lg:col-span-7 xl:col-span-8 flex flex-col space-y-4 sm:space-y-6 order-1 lg:order-2">
        
        <!-- Canvas Preview Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 flex-1 flex flex-col">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-3 sm:mb-5">
            <h2 class="text-sm sm:text-base font-bold text-slate-900 flex items-center">
              <i class="fa-solid fa-stamp text-red-600 mr-2"></i> 도장 실시간 프리뷰
            </h2>
            <div class="flex items-center space-x-1.5 text-xs text-slate-500">
              <span class="inline-block w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></span>
              <span class="text-[11px] sm:text-xs">투명 PNG</span>
            </div>
          </div>

          <!-- Canvas Preview Box -->
          <div class="flex-1 min-h-[260px] sm:min-h-[340px] flex items-center justify-center rounded-xl p-4 sm:p-8 transparent-bg border border-slate-200 relative overflow-hidden shadow-inner">
            <canvas id="stampCanvas" width="400" height="400" class="w-48 h-48 sm:w-72 sm:h-72 object-contain drop-shadow-md transition-transform duration-200 active:scale-105"></canvas>
            
            <div class="absolute bottom-2 left-2 bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-md border border-slate-200 text-[10px] sm:text-xs text-slate-600 shadow-sm">
              400×400 px
            </div>
          </div>

          <!-- Action Buttons (Mobile-friendly Layout) -->
          <div class="mt-4 sm:mt-6 grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3">
            <button id="downloadBtn" class="w-full flex items-center justify-center py-3 sm:py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm sm:text-base font-bold text-white bg-red-600 hover:bg-red-700 active:bg-red-800 transition-all active:scale-[0.98]">
              <i class="fa-solid fa-download mr-2"></i> 투명 PNG 저장
            </button>
            <button id="copyBtn" class="w-full flex items-center justify-center py-3 sm:py-3.5 px-4 border border-slate-300 rounded-xl shadow-sm text-sm sm:text-base font-bold text-slate-700 bg-white hover:bg-slate-50 active:bg-slate-100 transition-all active:scale-[0.98]">
              <i class="fa-solid fa-copy mr-2"></i> 클립보드 복사
            </button>
          </div>
        </div>

        <!-- Sample Preview Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-3">
          <h3 class="text-xs sm:text-sm font-bold text-slate-900 flex items-center">
            <i class="fa-solid fa-file-contract text-slate-500 mr-2"></i> 문서 날인 예시
          </h3>
          <div class="p-3 sm:p-4 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">
            <div class="space-y-1 text-xs text-slate-600">
              <p class="font-bold text-slate-800">위 사실을 확인합니다.</p>
              <p class="text-[11px] text-slate-500">2026. 10. 26.</p>
              <p class="pt-1">성명: <span id="sampleName" class="font-bold text-slate-900">홍길동</span> (인)</p>
            </div>
            <div class="w-12 h-12 sm:w-16 sm:h-16 flex items-center justify-center">
              <img id="sampleStampImg" class="w-12 h-12 sm:w-16 sm:h-16 object-contain opacity-90 -rotate-6" alt="도장 샘플">
            </div>
          </div>
        </div>

      </div>

      <!-- Left Controls Panel (Inputs and Customization) -->
      <div class="lg:col-span-5 xl:col-span-4 space-y-4 sm:space-y-6 order-2 lg:order-1">
        
        <!-- Input Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-4">
          <h2 class="text-sm sm:text-base font-bold text-slate-900 flex items-center border-b border-slate-100 pb-2.5">
            <i class="fa-solid fa-pen-clip text-red-600 mr-2"></i> 이름 및 글씨체 설정
          </h2>

          <!-- 이름 입력 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">성명 / 이름 입력</label>
            <div class="relative">
              <input type="text" id="nameInput" value="홍길동" maxlength="10" placeholder="예: 홍길동"
                class="block w-full px-3.5 py-2.5 sm:py-3 text-base sm:text-lg font-medium border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition-all">
              <div class="absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-slate-400 pointer-events-none">
                <span id="charCount">3</span>/10자
              </div>
            </div>
          </div>

          <!-- '인' 자동 추가 -->
          <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200">
            <div>
              <span class="text-xs sm:text-sm font-semibold text-slate-700">접미사 '인(印)' 자동 추가</span>
              <p class="text-[10px] sm:text-xs text-slate-500">3글자 입력 시 전통 2x2 직인 완성</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="autoInCheck" class="sr-only peer" checked>
              <div class="w-10 h-5 sm:w-11 sm:h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 sm:after:h-5 sm:after:w-5 after:transition-all peer-checked:bg-red-600"></div>
            </label>
          </div>

          <!-- 폰트 선택 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">글씨체 (저작권 무료)</label>
            <div class="grid grid-cols-1 gap-1.5 max-h-48 sm:max-h-56 overflow-y-auto pr-1 scroll-touch" id="fontList">
              <!-- JS로 dynamic 생성 -->
            </div>
          </div>
        </div>

        <!-- Customization Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-4">
          <h2 class="text-sm sm:text-base font-bold text-slate-900 flex items-center border-b border-slate-100 pb-2.5">
            <i class="fa-solid fa-sliders text-red-600 mr-2"></i> 모양 및 디테일 설정
          </h2>

          <!-- 도장 외곽선 모양 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">도장 형태</label>
            <div class="grid grid-cols-4 gap-1.5">
              <button type="button" data-shape="circle" class="shape-btn flex flex-col items-center justify-center p-2 border-2 rounded-xl border-red-600 bg-red-50 text-red-600 text-xs font-medium transition-all">
                <div class="w-5 h-5 border-2 border-current rounded-full mb-1"></div>
                원형
              </button>
              <button type="button" data-shape="oval" class="shape-btn flex flex-col items-center justify-center p-2 border-2 rounded-xl border-slate-200 text-slate-600 text-xs font-medium transition-all">
                <div class="w-6 h-4 border-2 border-current rounded-full mb-1"></div>
                타원형
              </button>
              <button type="button" data-shape="rect-round" class="shape-btn flex flex-col items-center justify-center p-2 border-2 rounded-xl border-slate-200 text-slate-600 text-xs font-medium transition-all">
                <div class="w-5 h-5 border-2 border-current rounded-md mb-1"></div>
                둥근사각
              </button>
              <button type="button" data-shape="rect" class="shape-btn flex flex-col items-center justify-center p-2 border-2 rounded-xl border-slate-200 text-slate-600 text-xs font-medium transition-all">
                <div class="w-5 h-5 border-2 border-current mb-1"></div>
                직사각형
              </button>
            </div>
          </div>

          <!-- 인주 색상 선택 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">인주 색상</label>
            <div class="flex items-center justify-between space-x-2">
              <button type="button" data-color="#dc2626" class="color-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-red-600 ring-2 ring-offset-2 ring-red-600 transition-all"></button>
              <button type="button" data-color="#b91c1c" class="color-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-red-700 transition-all"></button>
              <button type="button" data-color="#991b1b" class="color-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-red-800 transition-all"></button>
              <button type="button" data-color="#ea580c" class="color-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-orange-600 transition-all"></button>
              <button type="button" data-color="#000000" class="color-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-black transition-all"></button>
              <button type="button" data-color="#1d4ed8" class="color-btn w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-blue-700 transition-all"></button>
              <div class="relative flex-1">
                <input type="color" id="customColor" value="#dc2626" class="w-full h-7 sm:h-8 cursor-pointer rounded-lg border border-slate-200 opacity-0 absolute inset-0">
                <div class="w-full h-7 sm:h-8 border border-slate-300 rounded-lg flex items-center justify-center text-xs text-slate-500 bg-slate-50 pointer-events-none">
                  직접
                </div>
              </div>
            </div>
          </div>

          <!-- 슬라이더 컨트롤 -->
          <div class="space-y-3.5 pt-1">
            <div>
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>테두리 두께</span>
                <span id="borderWidthVal" class="text-red-600 font-bold">12px</span>
              </div>
              <input type="range" id="borderWidth" min="2" max="24" value="12" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-600">
            </div>

            <div>
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>글자 크기 스케일</span>
                <span id="fontSizeVal" class="text-red-600 font-bold">100%</span>
              </div>
              <input type="range" id="fontSizeScale" min="70" max="130" value="100" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-600">
            </div>

            <div>
              <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                <span>인주 질감 (빈티지 번짐/마모)</span>
                <span id="roughnessVal" class="text-red-600 font-bold">중간 (25%)</span>
              </div>
              <input type="range" id="roughness" min="0" max="60" value="25" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-600">
            </div>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-2xl flex items-center space-x-2 z-50 whitespace-nowrap">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">처리되었습니다.</span>
  </div>

  <script>
    // 폰트 설정 (Google Fonts OFL 라이선스)
    const FONTS = [
      { id: 'Nanum Myeongjo', name: '나눔명조 (공문서/정석)', family: "'Nanum Myeongjo', serif" },
      { id: 'Gowun Batang', name: '고운바탕 (단정함)', family: "'Gowun Batang', serif" },
      { id: 'Song Myung', name: '송명 (전통 붓글씨)', family: "'Song Myung', serif" },
      { id: 'Dokdo', name: '독도체 (개성있는 손글씨)', family: "'Dokdo', cursive" },
      { id: 'Nanum Pen Script', name: '나눔손글씨 펜 (서명/자필)', family: "'Nanum Pen Script', cursive" },
      { id: 'Black Han Sans', name: '검은고딕 (굵은 직인)', family: "'Black Han Sans', sans-serif" },
      { id: 'Nanum Gothic', name: '나눔고딕 (깔끔한 정자)', family: "'Nanum Gothic', sans-serif" }
    ];

    // 앱 상태
    const state = {
      name: '홍길동',
      autoIn: true,
      font: FONTS[0],
      shape: 'circle',
      color: '#dc2626',
      borderWidth: 12,
      fontSizeScale: 100,
      roughness: 25
    };

    // DOM 요소 캐싱
    const canvas = document.getElementById('stampCanvas');
    const ctx = canvas.getContext('2d');
    const nameInput = document.getElementById('nameInput');
    const charCount = document.getElementById('charCount');
    const autoInCheck = document.getElementById('autoInCheck');
    const fontListContainer = document.getElementById('fontList');
    const borderWidthInput = document.getElementById('borderWidth');
    const borderWidthVal = document.getElementById('borderWidthVal');
    const fontSizeScaleInput = document.getElementById('fontSizeScale');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const roughnessInput = document.getElementById('roughness');
    const roughnessVal = document.getElementById('roughnessVal');
    const customColorInput = document.getElementById('customColor');
    const sampleName = document.getElementById('sampleName');
    const sampleStampImg = document.getElementById('sampleStampImg');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');

    // 앱 초기화
    function init()
