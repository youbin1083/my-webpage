<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 시작 홈페이지</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --pink: #ff8fb3;
      --peach: #ffb27d;
      --yellow: #ffe28a;
      --mint: #a9e8d0;
      --purple: #c8b6ff;
      --ink: #443b4f;
      --white: rgba(255,255,255,.82);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 15%, rgba(255,143,179,.38), transparent 27%),
        radial-gradient(circle at 88% 12%, rgba(255,226,138,.45), transparent 25%),
        radial-gradient(circle at 78% 82%, rgba(169,232,208,.42), transparent 28%),
        linear-gradient(135deg, #fff9fb 0%, #fffdf4 48%, #f5fffb 100%);
      overflow-x: hidden;
    }
    .blob {
      position: fixed; border-radius: 50%; filter: blur(1px); opacity: .55;
      z-index: -1; pointer-events: none;
    }
    .blob.one { width: 170px; height: 170px; background: #ffc4d8; left: -45px; top: 48%; }
    .blob.two { width: 130px; height: 130px; background: #b8d9ff; right: -35px; top: 45%; }
    .wrap { width: min(1080px, 92%); margin: 0 auto; padding: 42px 0 56px; }
    header { text-align: center; margin-bottom: 30px; }
    .greeting {
      display: inline-block; padding: 8px 16px; border-radius: 999px;
      background: rgba(255,255,255,.7); box-shadow: 0 8px 24px rgba(130,100,120,.08);
      font-size: 14px; font-weight: 700; color: #a05b79;
    }
    h1 { margin: 14px 0 7px; font-size: clamp(32px, 6vw, 54px); letter-spacing: -2px; }
    .subtitle { margin: 0; color: #7f7487; }
    .clock-card {
      background: var(--white); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.9); border-radius: 28px;
      padding: 28px; text-align: center; box-shadow: 0 18px 45px rgba(125,94,118,.12);
      margin-bottom: 22px;
    }
    #time { font-size: clamp(44px, 9vw, 76px); font-weight: 800; letter-spacing: -3px; }
    #date { margin-top: 6px; font-size: 17px; color: #817687; font-weight: 600; }
    .search {
      display: flex; gap: 10px; max-width: 760px; margin: 0 auto 24px;
      background: rgba(255,255,255,.9); padding: 10px; border-radius: 20px;
      box-shadow: 0 14px 35px rgba(125,94,118,.11);
    }
    .search input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
      padding: 13px 15px; font-size: 16px; color: var(--ink);
    }
    .search button, .add-btn {
      border: 0; cursor: pointer; border-radius: 14px; padding: 0 20px;
      font-weight: 800; color: white; background: linear-gradient(135deg, var(--pink), var(--peach));
      box-shadow: 0 8px 18px rgba(255,143,179,.28);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .card {
      background: var(--white); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.9); border-radius: 26px;
      padding: 25px; box-shadow: 0 18px 45px rgba(125,94,118,.11);
    }
    .card h2 { margin: 0 0 17px; font-size: 22px; }
    .todo-input { display: flex; gap: 9px; margin-bottom: 15px; }
    .todo-input input {
      flex: 1; min-width: 0; border: 2px solid #f0e7ee; border-radius: 13px;
      padding: 12px 13px; outline: none; background: rgba(255,255,255,.7);
    }
    .todo-input input:focus { border-color: #ffabc6; }
    .add-btn { height: 44px; padding: 0 16px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex; align-items: center; gap: 11px; padding: 12px 6px;
      border-bottom: 1px dashed #eadfe7;
    }
    li:last-child { border-bottom: 0; }
    li span { flex: 1; line-height: 1.4; }
    li.done span { text-decoration: line-through; color: #aaa0aa; }
    .check {
      width: 22px; height: 22px; border: 2px solid #ffacc6; border-radius: 7px;
      background: white; cursor: pointer; flex: 0 0 auto;
    }
    li.done .check { background: #ff9fbe; position: relative; }
    li.done .check::after { content: "✓"; color: white; position: absolute; left: 3px; top: -2px; font-weight: 900; }
    .delete {
      border: 0; background: transparent; color: #c3b6c2; cursor: pointer; font-size: 18px;
    }
    .quick {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .quick a {
      text-decoration: none; color: var(--ink); padding: 15px; border-radius: 15px;
      background: linear-gradient(135deg, rgba(255,206,221,.65), rgba(255,237,176,.62));
      font-weight: 700; transition: transform .18s;
    }
    .quick a:nth-child(2n) { background: linear-gradient(135deg, rgba(201,239,226,.7), rgba(207,224,255,.7)); }
    .quick a:hover { transform: translateY(-2px); }
    .empty { color: #9b909b; text-align: center; padding: 18px 0 8px; font-size: 14px; }
    footer { text-align: center; margin-top: 26px; color: #9d929e; font-size: 13px; }
    @media (max-width: 720px) {
      .wrap { padding-top: 28px; }
      .grid { grid-template-columns: 1fr; }
      .search button { padding: 0 14px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="blob one"></div><div class="blob two"></div>

  <main class="wrap">
    <header>
      <div class="greeting">🌷 오늘도 좋은 하루!</div>
      <h1>나의 시작 페이지</h1>
      <p class="subtitle">필요한 것만 한곳에 모아둔 나만의 작은 공간</p>
    </header>

    <section class="clock-card">
      <div id="time">00:00:00</div>
      <div id="date">0000년 00월 00일</div>
    </section>

    <form class="search" id="searchForm">
      <span style="font-size:22px; padding:9px 2px 9px 8px;">🔎</span>
      <input id="searchInput" type="search" placeholder="Google에서 검색하기..." autocomplete="off">
      <button type="submit">검색</button>
    </form>

    <section class="grid">
      <div class="card">
        <h2>🌼 오늘의 할 일</h2>
        <form class="todo-input" id="todoForm">
          <input id="todoInput" type="text" placeholder="할 일을 입력해 줘" maxlength="100">
          <button class="add-btn" type="submit">추가</button>
        </form>
        <ul id="todoList"></ul>
        <div class="empty" id="emptyMessage">아직 할 일이 없어! ✨</div>
      </div>

      <div class="card">
        <h2>🧸 자주 가는 곳</h2>
        <div class="quick">
          <a href="https://www.google.com/" target="_blank">🌐 Google</a>
          <a href="https://www.youtube.com/" target="_blank">▶️ YouTube</a>
          <a href="https://mail.google.com/" target="_blank">✉️ Gmail</a>
          <a href="https://calendar.google.com/" target="_blank">🗓️ Calendar</a>
        </div>
      </div>
    </section>

    <footer>오늘도 천천히, 하나씩 🌸</footer>
  </main>

  <script>
    // 날짜와 시간
    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");
    const days = ["일", "월", "화", "수", "목", "금", "토"];

    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      timeEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      dateEl.textContent =
        `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Google 검색
    document.getElementById("searchForm").addEventListener("submit", e => {
      e.preventDefault();
      const query = document.getElementById("searchInput").value.trim();
      if (query) window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
    });

    // 할 일: 브라우저 localStorage에 저장
    const STORAGE_KEY = "my-start-page-todos";
    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function renderTodos() {
      const list = document.getElementById("todoList");
      const empty = document.getElementById("emptyMessage");
      list.innerHTML = "";
      empty.style.display = todos.length ? "none" : "block";

      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const check = document.createElement("button");
        check.className = "check";
        check.setAttribute("aria-label", "완료 처리");
        check.onclick = () => {
          todos[index].done = !todos[index].done;
          saveTodos();
          renderTodos();
        };

        const span = document.createElement("span");
        span.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "×";
        del.setAttribute("aria-label", "삭제");
        del.onclick = () => {
          todos.splice(index, 1);
          saveTodos();
          renderTodos();
        };

        li.append(check, span, del);
        list.appendChild(li);
      });
    }

    document.getElementById("todoForm").addEventListener("submit", e => {
      e.preventDefault();
      const input = document.getElementById("todoInput");
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      saveTodos();
      renderTodos();
      input.value = "";
      input.focus();
    });

    renderTodos();
  </script>
</body>
</html>
