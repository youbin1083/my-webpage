<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주제별 학습 퀴즈</title>
<style>
:root{
  --bg:#eaf4fb; --card:#ffffff; --text:#1c2b39; --sub:#5b6b7a;
  --main:#1e6fd9; --main-d:#1556ad; --ok:#1f9d55; --ok-bg:#e3f6ea;
  --bad:#d64545; --bad-bg:#fdeaea; --line:#d5e2ee;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1b27;--card:#182737;--text:#eaf2f9;--sub:#9fb2c4;--main:#4a95f0;--main-d:#2f7ad8;
    --ok:#4cc582;--ok-bg:#183a2a;--bad:#f07a7a;--bad-bg:#3d2020;--line:#2c4156;}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px 14px;line-height:1.5}
.app{width:100%;max-width:640px}
h1{font-size:clamp(1.4rem,4vw,1.9rem);margin:0 0 4px;text-align:center}
.tag{text-align:center;color:var(--sub);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border-radius:20px;padding:clamp(18px,4vw,30px);
  box-shadow:0 6px 24px rgba(20,60,100,.12)}
.top{display:flex;justify-content:space-between;font-weight:700;color:var(--sub);font-size:.95rem;margin-bottom:8px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar>div{height:100%;width:0;background:var(--main);transition:width .4s}
.q{font-size:clamp(1.15rem,3.6vw,1.45rem);font-weight:800;margin:0 0 18px;word-break:keep-all}
.opts{display:grid;gap:12px}
.opt{font:inherit;font-size:clamp(1rem,3vw,1.15rem);text-align:left;padding:16px 18px;min-height:56px;
  border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);
  cursor:pointer;display:flex;gap:12px;align-items:center;transition:transform .1s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--main)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .n{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.opt.bad .n{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.msg{min-height:3.2em;margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:700;display:none}
.msg.show{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg small{display:block;font-weight:500;color:var(--text);margin-top:2px}
.btn{font:inherit;font-weight:800;font-size:1.05rem;border:0;border-radius:14px;padding:14px 26px;
  background:var(--main);color:#fff;cursor:pointer;margin-top:16px;min-height:50px}
.btn:hover{background:var(--main-d)}
.btn.full{width:100%}
.hide{display:none}
.center{text-align:center}
.big{font-size:clamp(2.6rem,12vw,4rem);font-weight:900;color:var(--main);margin:6px 0}
.emoji{font-size:3rem}
.review{text-align:left;margin-top:14px;display:grid;gap:6px;font-size:.95rem}
.review div{padding:8px 12px;border-radius:10px;background:var(--bg)}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic{font:inherit;font-weight:800;font-size:1.15rem;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:20px 8px;cursor:pointer;min-height:96px}
.topic span{display:block;font-size:2.2rem}
.topic:hover{border-color:var(--main)}
.btn.sub{background:var(--line);color:var(--text)}
.mute{background:none;border:0;color:var(--sub);cursor:pointer;font:inherit;font-size:.9rem;margin-top:10px}
</style>
</head>
<body>
<main class="app">
  <h1>📚 주제별 학습 퀴즈</h1>
  <p class="tag">주제를 골라 10문제에 도전해 보세요!</p>

  <section class="card center" id="start">
    <p class="q">어떤 주제로 시작할까요?</p>
    <div class="topics">
      <button class="topic" data-t="dokdo"><span>🏝️</span>독도</button>
      <button class="topic" data-t="science"><span>🔬</span>과학</button>
      <button class="topic" data-t="history"><span>🌍</span>역사</button>
      <button class="topic" data-t="korean"><span>🏯</span>한국사</button>
    </div>
  </section>

  <section class="card hide" id="quiz">
    <div class="top"><span id="no">1 / 10</span><span id="sc">점수 0점</span></div>
    <div class="bar"><div id="bar"></div></div>
    <h2 class="q" id="q"></h2>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <button class="btn full hide" id="next">다음 문제 ▶</button>
  </section>

  <section class="card hide center" id="result">
    <div class="emoji" id="rEmoji">🎉</div>
    <div class="big" id="rScore"></div>
    <p class="q" id="rText"></p>
    <div class="review" id="review"></div>
    <button class="btn full" id="retry">🔄 같은 주제 다시 도전하기</button>
    <button class="btn full sub" id="home">🏠 주제 바꾸기</button>
  </section>
  <div class="center"><button class="mute" id="mute">🔊 효과음 켜짐</button></div>
</main>

["한글을 만든 임금님은?","세종대왕","이순신|정약용|태조","1443년에 만들었어요."],
["임진왜란 때 거북선을 만든 장군은?","이순신","권율|김유신|강감찬","바다에서 큰 승리를 거뒀어요."],
["3·1 운동이 일어난 해는?","1919년","1945년|1910년|1950년","전국에서 만세 운동이 일어났어요."],
["고구려를 세운 사람은?","주몽","온조|박혁거세|김수로","고구려는 삼국 중 하나예요."],
["한글의 옛 이름은?","훈민정음","대동여지도|동의보감|직지","백성을 가르치는 바른 소리라는 뜻이에요."],
["고려를 세운 사람은?","왕건","이성계|견훤|궁예","918년에 세웠어요."],
["조선을 세운 사람은?","이성계","왕건|궁예|견훤","1392년에 조선을 세웠어요."],
["광복절은 몇 월 며칠일까요?","8월 15일","3월 1일|10월 3일|6월 25일","1945년 광복을 기념해요."],
["단군의 고조선 건국을 기념하는 날은?","개천절","한글날|현충일|삼일절","10월 3일이에요."],
["한글날은 몇 월 며칠일까요?","10월 9일","10월 3일|8월 15일|5월 5일","훈민정음 반포를 기념해요."],
["백제를 세운 사람은?","온조","주몽|왕건|김유신","백제는 삼국 중 하나예요."],
["신라의 수도였던 오늘날의 도시는?","경주","부여|평양|공주","옛 이름은 금성(서라벌)이에요."],
["《동의보감》을 쓴 의학자는?","허준","정약용|김정호|장영실","조선 시대 의학책이에요."],
["〈대동여지도〉를 만든 사람은?","김정호","허준|장영실|이황","조선의 지도 제작자예요."],
["비의 양을 재는 측우기를 만든 과학자는?","장영실","허준|김정호|정약용","세종대왕 때 만들어졌어요."],
["임진왜란이 일어난 해는?","1592년","1392년|1910년|1636년","일본이 조선을 침략했어요."],
["팔만대장경이 보관된 절은?","합천 해인사","불국사|석굴암|부석사","세계유산으로 등재되었어요."]
])}
};
const $=id=>document.getElementById(id);
let order,idx,score,first,log,locked,soundOn=true,ctx,topic,seen={};

function beep(freqs,dur=.14,type="sine"){
  if(!soundOn)return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    let t=ctx.currentTime;
    freqs.forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*dur);
      g.gain.exponentialRampToValueAtTime(.25,t+i*dur+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);
      o.connect(g).connect(ctx.destination);
      o.start(t+i*dur);o.stop(t+i*dur+dur+.02);
    });
  }catch(e){}
}
const sOk=()=>beep([660,880,1100],.12);
const sBad=()=>beep([220,165],.18,"square");
const sEnd=()=>beep([523,659,784,1047],.16);

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const show=id=>{["start","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo({top:0,behavior:"smooth"});};

function begin(t){
  if(typeof t==="string")topic=t;
  const pool=BANK[topic].items,prev=seen[topic]||[];
  const fresh=shuffle(pool.filter(d=>!prev.includes(d.q)));
  const old=shuffle(pool.filter(d=>prev.includes(d.q)));
  order=shuffle([...fresh,...old].slice(0,10));
  seen[topic]=order.map(d=>d.q);
  idx=0;score=0;log=[];
  show("quiz");render();
}
function render(){
  const d=order[idx];locked=false;first=true;
  $("no").textContent=`${BANK[topic].name} ${idx+1} / ${order.length}`;
  $("sc").textContent=`점수 ${score*10}점`;
  $("bar").style.width=(idx/order.length*100)+"%";
  $("q").textContent=`Q${idx+1}. ${d.q}`;
  $("msg").className="msg";$("msg").innerHTML="";
  $("next").classList.add("hide");
  const box=$("opts");box.innerHTML="";
  shuffle([d.a,...d.w]).forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML=`<span class="n">${i+1}</span><span></span>`;
    b.lastChild.textContent=t;
    b.onclick=()=>pick(b,t);
    box.appendChild(b);
  });
}
function pick(btn,t){
  if(locked)return;
  const d=order[idx],m=$("msg");
  if(t===d.a){
    locked=true;
    btn.classList.add("ok");
    document.querySelectorAll(".opt").forEach(o=>o.disabled=true);
    if(first)score++;
    log.push({q:d.q,a:d.a,ok:first});
    m.className="msg show ok";
    m.innerHTML=`🎉 정답이에요!<small>${d.e}</small>`;
    sOk();
    $("sc").textContent=`점수 ${score*10}점`;
    $("next").textContent=idx===order.length-1?"결과 보기 🏆":"다음 문제 ▶";
    $("next").classList.remove("hide");
  }else{
    first=false;
    btn.classList.add("bad");btn.disabled=true;
    m.className="msg show bad";
    m.innerHTML="🤔 다시 생각해보세요!";
    sBad();
  }
}
function finish(){
  const pts=score*10;
  show("result");
  $("rScore").textContent=`${pts}점`;
  const rate=score/order.length;
  $("rEmoji").textContent=rate===1?"🏆":rate>=.7?"🎉":rate>=.4?"👍":"💪";
  $("rText").textContent=`${order.length}문제 중 ${score}문제를 한 번에 맞혔어요! `+
    (rate===1?"독도 박사님이에요!":rate>=.7?"정말 잘했어요!":rate>=.4?"조금만 더 알아볼까요?":"다시 도전해서 점수를 올려 봐요!");
  $("review").innerHTML="";
  log.forEach((l,i)=>{
    const r=document.createElement("div");
    r.textContent=`${l.ok?"✅":"❌"} ${i+1}. ${l.a}`;
    $("review").appendChild(r);
  });
  $("bar").style.width="100%";
  sEnd();
}
document.querySelectorAll(".topic").forEach(b=>b.onclick=()=>begin(b.dataset.t));
$("retry").onclick=()=>begin();
$("home").onclick=()=>show("start");
$("next").onclick=()=>{ if(idx<order.length-1){idx++;render();}else finish(); };
$("mute").onclick=()=>{soundOn=!soundOn;$("mute").textContent=soundOn?"🔊 효과음 켜짐":"🔇 효과음 꺼짐";};
</script>
</body>
