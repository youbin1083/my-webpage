<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A7C86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 운동">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>오늘의 운동</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F4;--card:#FFF;--ink:#14262E;--sub:#5B6F78;--line:#D5E0E4;--pri:#0A7C86;--on-pri:#FFF;--done:#E1F3EC;--warn:#C8432F;--ring-bg:#D5E0E4;--acc:#D9820B}
@media(prefers-color-scheme:dark){:root{--bg:#0F1B20;--card:#17262D;--ink:#E8F0F2;--sub:#93A8B1;--line:#2A3E47;--pri:#3CC2CC;--on-pri:#0B1D21;--done:#16403B;--warn:#F08A78;--ring-bg:#2A3E47;--acc:#F2B14C}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:980px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 24px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
h1{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;font-size:2rem;margin:0}
h2{font-size:1rem;margin:0 0 12px}
.sub{color:var(--sub);margin:0;font-size:.88rem}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn{background:var(--pri);color:var(--on-pri);border:0;border-radius:12px;padding:11px 18px;font-weight:700}
.btn.out{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;padding:8px 14px;font-size:.88rem}
.link{background:none;border:0;color:var(--sub);font-size:.85rem;text-decoration:underline;padding:4px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.warn{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;padding:12px 0;border-radius:12px;color:var(--sub);font-weight:500}
.nav button[aria-pressed=true]{color:var(--pri);font-weight:700;background:var(--bg)}
@media(min-width:820px){body{padding-bottom:24px}.nav{position:static;max-width:380px;margin:0 16px 16px max(16px,calc((100vw - 980px)/2));border:1px solid var(--line);border-radius:14px;padding:4px}}
.grid{display:grid;gap:0 16px}
@media(min-width:820px){.grid{grid-template-columns:300px 1fr;align-items:start}.side{position:sticky;top:16px}}
.pane{max-width:760px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.datenav strong{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:1.3rem}
.icb{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.3rem;line-height:1}
.icb:disabled{opacity:.35;cursor:default}
.sum{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--ring-bg)}.ring .fg{stroke:var(--pri);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:1.9rem}
.sum p{margin:0}.sum .pct{font-weight:700;font-size:1.05rem}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:1px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:grid;grid-template-columns:26px 1fr auto 38px;gap:8px 12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
li.done{background:var(--done);border-color:transparent}
li.empty{display:block;text-align:center;color:var(--sub);border-style:dashed;padding:26px 8px}
.cb{grid-area:1/1;appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--sub);border-radius:8px;margin:0;display:grid;place-content:center;cursor:pointer}
.cb:checked{background:var(--pri);border-color:var(--pri)}
.cb:checked::after{content:"";width:6px;height:12px;border:solid var(--on-pri);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.txt{grid-area:1/2;display:flex;flex-direction:column;min-width:0;cursor:pointer}
.name{font-weight:500;overflow-wrap:anywhere}.detail{color:var(--sub);font-size:.82rem}
li.done .name{text-decoration:line-through;color:var(--sub)}
.val{grid-area:1/3;display:flex;align-items:center;gap:6px;color:var(--sub);font-size:.88rem}
.val input{width:84px;text-align:right;padding:8px 10px}
.del{grid-area:1/4;background:none;border:0;color:var(--sub);width:38px;height:38px;border-radius:10px;font-size:1.2rem}
.del:hover{color:var(--warn);background:var(--bg)}
@media(max-width:440px){li{grid-template-columns:26px 1fr 38px}.del{grid-area:1/3}.val{grid-area:2/2/3/4}}
.addform{display:grid;gap:8px}
@media(min-width:520px){.addform{grid-template-columns:1.4fr 90px 1fr auto}}
.status{min-height:1.3em;margin:8px 2px 0;font-size:.85rem;color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mnav strong{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:1.4rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;color:var(--sub);font-size:.8rem;padding-bottom:2px}
.cell{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-size:.95rem}
.cell:disabled{opacity:.4;cursor:default}
.cell.today{border:2px solid var(--ink);font-weight:700}.cell.full{border-color:var(--pri)}
.cell small{color:var(--sub);font-size:.66rem;line-height:1.1}
.cell i{position:absolute;left:8px;right:8px;bottom:6px;height:5px;border-radius:3px;background:var(--ring-bg)}
.cell i::after{content:"";display:block;height:100%;width:calc(var(--r)*100%);background:var(--pri);border-radius:3px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:620px){.cards{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:1.8rem;line-height:1.2}
.stat span{color:var(--sub);font-size:.82rem}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:.9rem;margin-bottom:10px}
.track{height:10px;background:var(--ring-bg);border-radius:6px;overflow:hidden}.track div{height:100%;background:var(--pri);border-radius:6px}
.chart svg{width:100%;height:auto;display:block}
.gb{fill:var(--pri);opacity:.45}.gl{fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ax{stroke:var(--line)}.tx{fill:var(--sub);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--sub);font-size:.82rem;margin:8px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bk{display:flex;gap:8px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>오늘의 운동</h1><p class="sub">기록은 이 기기의 브라우저에 자동 저장돼요.</p></div>
    <button class="btn out" id="inst" type="button">홈 화면에 추가</button>
  </div>
  <div class="warn" id="warn" hidden>이 브라우저에서는 저장소를 사용할 수 없어 기록이 유지되지 않아요. 시크릿 모드를 끄고 다시 열어 주세요.</div>
  <div id="view"></div>
</div>
<nav class="nav" aria-label="화면 선택">
  <button data-view="today" aria-pressed="true">오늘</button>
  <button data-view="cal" aria-pressed="false">달력</button>
  <button data-view="stats" aria-pressed="false">통계</button>
</nav>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
(function(){
// ---- 서비스 워커 등록 (오프라인 사용) ----
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

var K='workout-app-v2',K1='workout-app-v1',CIRC=339.29,WD=['일','월','화','수','목','금','토'];
var PRE=[['달리기','km',3],['걷기','km',5],['푸시업','개',30],['스쿼트','개',50],['윗몸일으키기','개',30],['플랭크','분',2],['줄넘기','개',300],['스트레칭','',0]];
var S={plan:[],logs:{}},view='today',sel=today(),vm=ym(new Date()),exSel='',note='',ok=true;
var $=function(i){return document.getElementById(i)};

// ---- 불러오기 (v1 데이터가 있으면 이전) ----
try{
  var r=localStorage.getItem(K);
  if(r){var p=JSON.parse(r);if(p&&Array.isArray(p.plan)&&p.logs)S=p;}
  else{var o=JSON.parse(localStorage.getItem(K1)||'null');if(o&&o.plan){
    S.plan=o.plan.map(function(a){return{id:a.id,name:a.name,unit:'',goal:0}});
    Object.keys(o.done||{}).forEach(function(d){var e={};o.done[d].forEach(function(id){e[id]={d:1,v:0}});if(o.done[d].length)S.logs[d]={t:(o.hist&&o.hist[d]?o.hist[d].total:o.done[d].length),e:e};});
  }}
}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S));ok=true}catch(e){ok=false}}

function pad(n){return String(n).padStart(2,'0')}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return dk(new Date())}
function pd(s){return new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))}
function ym(d){return{y:d.getFullYear(),m:d.getMonth()}}
function num(v){return String(Math.round(v*100)/100)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function act(){return S.plan.filter(function(x){return!x.del})}
function E(t,id){return(S.logs[t]&&S.logs[t].e[id])||{d:0,v:0}}
function setE(t,id,p){
  var L=S.logs[t]||(S.logs[t]={t:0,e:{}}),e=Object.assign({d:0,v:0},L.e[id],p);
  if(!e.d&&!e.v)delete L.e[id];else L.e[id]=e;
  if(Object.keys(L.e).length)L.t=act().length;else delete S.logs[t];
}
function dayStat(t){var L=S.logs[t],d=0;if(!L)return{d:0,t:0};for(var id in L.e)if(L.e[id].d)d++;return{d:d,t:Math.max(L.t,d)}}

function add(name,unit,goal){
  name=name.trim();goal=parseFloat(goal)||0;
  if(!name){note='운동 이름을 입력해 주세요.';return}
  if(act().some(function(x){return x.name===name})){note='이미 목록에 있는 운동이에요.';return}
  var old=S.plan.filter(function(x){return x.del&&x.name===name})[0];
  if(old){old.del=false;old.unit=unit;old.goal=goal}
  else S.plan.push({id:'e'+Date.now()+Math.floor(Math.random()*1000),name:name,unit:unit,goal:goal});
  note='';
}

function ring(r,txt){return'<div class="ring"><svg viewBox="0 0 128 128" aria-hidden="true"><circle class="bg" cx="64" cy="64" r="54"/><circle class="fg" cx="64" cy="64" r="54" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+(CIRC*(1-r)).toFixed(1)+'"/></svg><b>'+txt+'</b></div>'}

// ---- 오늘(날짜별 기록) ----
function vToday(){
  var a=act(),n=0;a.forEach(function(x){if(E(sel,x.id).d)n++});
  var tot=a.length,r=tot?n/tot:0,isT=sel===today(),d=pd(sel);
  var msg=!tot?'운동을 추가해 목록을 만들어 보세요.':n===tot?'모든 운동을 마쳤어요!':n===0?'아직 시작 전이에요.':(tot-n)+'개 남았어요.';
  var h='<div class="datenav"><button class="icb" data-shift="-1" aria-label="전날">‹</button><div style="text-align:center"><strong>'+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+WD[d.getDay()]+'요일</strong>'+(isT?'':'<br><button class="link" data-gotoday="1">오늘로 돌아가기</button>')+'</div><button class="icb" data-shift="1" aria-label="다음 날"'+(isT?' disabled':'')+'>›</button></div>';
  h+='<div class="grid"><aside class="side"><section class="card sum" aria-label="완료 현황">'+ring(r,n+'/'+tot)+'<div><p class="pct">'+Math.round(r*100)+'% 완료</p><p class="sub">'+msg+'</p></div></section></aside><div>';
  h+='<section class="card"><h2>운동 목록</h2><ul>'+(a.length?a.map(function(x){
    var e=E(sel,x.id),g=x.goal>0?'목표 '+num(x.goal)+(x.unit?' '+x.unit:''):'';
    return'<li class="'+(e.d?'done':'')+'"><input class="cb" type="checkbox" id="c'+x.id+'" data-id="'+x.id+'"'+(e.d?' checked':'')+'><label class="txt" for="c'+x.id+'"><span class="name">'+esc(x.name)+'</span>'+(g?'<span class="detail">'+g+'</span>':'')+'</label>'+
      (x.unit?'<div class="val"><input type="number" inputmode="decimal" min="0" step="any" data-val="'+x.id+'" value="'+(e.v||'')+'" placeholder="0" aria-label="'+esc(x.name)+' 수치"><span>'+esc(x.unit)+'</span></div>':'')+
      '<button class="del" data-del="'+x.id+'" aria-label="'+esc(x.name)+' 삭제">×</button></li>';
  }).join(''):'<li class="empty">아직 등록한 운동이 없어요. 아래에서 추가해 보세요.</li>')+'</ul></section>';
  var chips=PRE.map(function(p,i){return act().some(function(x){return x.name===p[0]})?'':'<button type="button" class="chip" data-pre="'+i+'">'+p[0]+'</button>'}).join('');
  h+='<section class="card"><h2>운동 항목 추가</h2><form class="addform" id="addForm" autocomplete="off"><input type="text" id="nName" maxlength="30" placeholder="운동 이름" aria-label="운동 이름"><select id="nUnit" aria-label="단위"><option value="km">km</option><option value="개">개</option><option value="분">분</option><option value="">체크만</option></select><input type="number" id="nGoal" min="0" step="any" inputmode="decimal" placeholder="목표 (선택)" aria-label="목표 수치"><button class="btn" type="submit">추가</button></form><p class="status" role="status">'+note+'</p>'+(chips?'<p class="sub">자주 하는 운동에서 고르기</p><div class="chips">'+chips+'</div>':'')+'</section></div></div>';
  return h;
}

// ---- 월 이동 바 ----
function mnav(){
  var cur=ym(new Date()),atMax=vm.y>cur.y||(vm.y===cur.y&&vm.m>=cur.m);
  return'<div class="mnav"><button class="icb" data-mon="-1" aria-label="이전 달">‹</button><strong>'+vm.y+'년 '+(vm.m+1)+'월</strong><button class="icb" data-mon="1" aria-label="다음 달"'+(atMax?' disabled':'')+'>›</button></div>';
}

// ---- 달력 ----
function vCal(){
  var f=new Date(vm.y,vm.m,1),N=new Date(vm.y,vm.m+1,0).getDate(),h='<div class="pane card">'+mnav()+'<div class="cal">';
  WD.forEach(function(w){h+='<div class="wd">'+w+'</div>'});
  for(var i=0;i<f.getDay();i++)h+='<span></span>';
  for(var d=1;d<=N;d++){
    var k=vm.y+'-'+pad(vm.m+1)+'-'+pad(d),s=dayStat(k),r=s.t?s.d/s.t:0;
    h+='<button class="cell'+(k===today()?' today':'')+(s.t&&s.d===s.t?' full':'')+'" data-day="'+k+'"'+(k>today()?' disabled':'')+' aria-label="'+(vm.m+1)+'월 '+d+'일 '+(s.t?s.d+'/'+s.t+' 완료':'기록 없음')+'"><span>'+d+'</span>'+(s.t?'<small>'+s.d+'/'+s.t+'</small>':'')+'<i style="--r:'+r.toFixed(2)+'"></i></button>';
  }
  return h+'</div><p class="sub" style="margin-top:12px">날짜를 누르면 그날의 기록을 보고 고칠 수 있어요.</p></div>';
}

// ---- 통계 ----
function chart(x){
  var N=new Date(vm.y,vm.m+1,0).getDate(),pre=vm.y+'-'+pad(vm.m+1)+'-',vals=[],cum=[],c=0,mx=0;
  for(var i=1;i<=N;i++){var e=E(pre+pad(i),x.id),v=x.unit?e.v:e.d;vals.push(v);c+=v;cum.push(c);if(v>mx)mx=v}
  mx=mx||1;var tot=c||1,W=600,H=220,L=40,R=46,T=14,B=26,pw=W-L-R,ph=H-T-B,bw=pw/N;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(x.name)+' 일별 수치와 누적 그래프"><line class="ax" x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'"/>';
  vals.forEach(function(v,i){var h=v/mx*ph;if(h>0)s+='<rect class="gb" x="'+(L+i*bw+bw*.18).toFixed(1)+'" y="'+(T+ph-h).toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"/>'});
  s+='<polyline class="gl" points="'+cum.map(function(v,i){return(L+(i+.5)*bw).toFixed(1)+','+(T+ph-v/tot*ph).toFixed(1)}).join(' ')+'"/>';
  var tk=[1,5,10,15,20,25];if(N-25>=3)tk.push(N);
  tk.forEach(function(d){s+='<text class="tx" x="'+(L+(d-.5)*bw).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+d+'</text>'});
  s+='<text class="tx" x="'+(L-6)+'" y="'+(T+8)+'" text-anchor="end">'+num(mx)+'</text><text class="tx" x="'+(W-R+6)+'" y="'+(T+8)+'">'+num(c)+'</text></svg>';
  return s+'<p class="legend"><span><i style="background:var(--pri);opacity:.45"></i>일별 (왼쪽 축)</span><span><i style="background:var(--acc)"></i>월 누적 (오른쪽 축)</span><span>단위: '+(x.unit||'회')+'</span></p>';
}
function vStats(){
  var N=new Date(vm.y,vm.m+1,0).getDate(),pre=vm.y+'-'+pad(vm.m+1)+'-',ad=0,sD=0,sT=0,per={};
  for(var d=1;d<=N;d++){
    var k=pre+pad(d),L=S.logs[k];if(!L)continue;
    var s=dayStat(k);if(s.d>0)ad++;sD+=s.d;sT+=s.t;
    for(var id in L.e){var p=per[id]||(per[id]={sum:0,dd:0});p.sum+=L.e[id].v;if(L.e[id].d)p.dd++}
  }
  var st=0,dt=new Date();if(dayStat(dk(dt)).d===0)dt.setDate(dt.getDate()-1);
  while(st<1100&&dayStat(dk(dt)).d>0){st++;dt.setDate(dt.getDate()-1)}
  var items=S.plan.filter(function(x){return per[x.id]&&(per[x.id].sum>0||per[x.id].dd>0)});
  var val=function(x){return x.unit?per[x.id].sum:per[x.id].dd},mxU={};
  items.forEach(function(x){var u=x.unit||'회';mxU[u]=Math.max(mxU[u]||0,val(x))});
  if(!items.some(function(x){return x.id===exSel}))exSel=items.length?items[0].id:'';
  var h='<div class="pane">'+'<div class="card" style="padding:12px 18px">'+mnav()+'</div>';
  h+='<div class="cards"><div class="stat"><b>'+ad+'일</b><span>운동한 날</span></div><div class="stat"><b>'+(sT?Math.round(sD/sT*100):0)+'%</b><span>월 달성률</span></div><div class="stat"><b>'+sD+'회</b><span>완료 체크</span></div><div class="stat"><b>'+st+'일</b><span>연속 기록</span></div></div>';
  if(!items.length)h+='<section class="card"><p class="sub" style="text-align:center;padding:20px 0">이 달의 기록이 아직 없어요. 오늘 화면에서 운동을 체크해 보세요.</p></section>';
  else{
    h+='<section class="card"><h2>운동별 월 누적</h2>'+items.map(function(x){var u=x.unit||'회',v=val(x);
      return'<div class="row"><span>'+esc(x.name)+'</span><div class="track"><div style="width:'+(mxU[u]?Math.max(3,v/mxU[u]*100):0).toFixed(0)+'%"></div></div><span>'+num(v)+' '+u+'</span></div>'}).join('')+'</section>';
    var cur=items.filter(function(x){return x.id===exSel})[0];
    h+='<section class="card chart"><h2>일별 · 누적 그래프</h2><select id="exsel" aria-label="운동 선택" style="margin-bottom:10px">'+items.map(function(x){return'<option value="'+x.id+'"'+(x.id===exSel?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select>'+chart(cur)+'</section>';
  }
  h+='<section class="card"><h2>백업</h2><p class="sub" style="margin-bottom:10px">브라우저 데이터를 지우기 전에 파일로 저장해 두세요.</p><div class="bk"><button class="btn out" id="exp" type="button">백업 저장</button><button class="btn out" id="imp" type="button">백업 불러오기</button></div></section></div>';
  return h;
}

function render(){
  document.querySelectorAll('.nav button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.view===view?'true':'false')});
  $('view').innerHTML=view==='today'?vToday():view==='cal'?vCal():vStats();
  note='';save();$('warn').hidden=ok;
}

// ---- 이벤트 ----
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var D=b.dataset;
  if(D.view){view=D.view;window.scrollTo(0,0)}
  else if(D.shift){var d=pd(sel);d.setDate(d.getDate()+(+D.shift));sel=dk(d);vm=ym(d)}
  else if(D.gotoday){sel=today();vm=ym(new Date())}
  else if(D.del){var x=S.plan.filter(function(p){return p.id===D.del})[0];if(!x||!confirm('“'+x.name+'” 운동을 목록에서 삭제할까요? 지난 기록은 통계에 남아요.'))return;x.del=true}
  else if(D.pre!==undefined){var p=PRE[+D.pre];add(p[0],p[1],p[2])}
  else if(D.day){sel=D.day;vm=ym(pd(sel));view='today';window.scrollTo(0,0)}
  else if(D.mon){var m=new Date(vm.y,vm.m+(+D.mon),1);vm=ym(m)}
  else if(b.id==='exp'){
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='workout-backup-'+today()+'.json';a.click();return}
  else if(b.id==='imp'){$('file').click();return}
  else return;
  render();
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='addForm')return;e.preventDefault();
  add($('nName').value,$('nUnit').value,$('nGoal').value);render();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.id){setE(sel,t.dataset.id,{d:t.checked?1:0})}
  else if(t.dataset.val){
    var v=parseFloat(t.value);v=isFinite(v)&&v>0?v:0;
    var x=S.plan.filter(function(p){return p.id===t.dataset.val})[0],pt={v:v};
    if(x&&x.goal>0&&v>=x.goal)pt.d=1;setE(sel,t.dataset.val,pt);
  }
  else if(t.id==='exsel'){exSel=t.value}
  else if(t.id==='file'){
    var f=t.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){try{var p=JSON.parse(rd.result);if(!p||!Array.isArray(p.plan)||typeof p.logs!=='object')throw 0;
      if(confirm('현재 기록을 백업 파일의 내용으로 바꿀까요?')){S={plan:p.plan,logs:p.logs};render()}}catch(x){alert('올바른 백업 파일이 아니에요.')}};
    rd.readAsText(f);t.value='';return;
  }
  else return;
  render();
});

// ---- 홈 화면 추가 버튼 ----
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e});
$('inst').addEventListener('click',function(){
  if(dp){dp.prompt();dp=null}
  else alert('iPhone: Safari 하단의 공유 버튼 → “홈 화면에 추가”\nAndroid: Chrome 메뉴(⋮) → “홈 화면에 추가” 또는 “앱 설치”');
});
if(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches))$('inst').hidden=true;

render();
})();
</script>
