<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>속담 이어 맞추기 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9f1ff;--bg2:#fff6d6;--ink:#262a6b;--card:#fff;--line:#262a6b;--yel:#ffd23f;--yel-d:#d9a400;--pink:#ff6b8a;--pink-d:#c93a5c;--mint:#3ddc97;--mint-d:#1d9e68;--blue:#4d7cff;--blue-d:#2a4fc4;--mute:#6b6fa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a45;--bg2:#241f52;--ink:#f3f1ff;--card:#262a6b;--line:#0d0f2c;--mute:#b3b6ee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a45;--bg2:#241f52;--ink:#f3f1ff;--card:#262a6b;--line:#0d0f2c;--mute:#b3b6ee;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,var(--bg2) 0,transparent 40%),var(--bg);min-height:100vh;font-size:clamp(16px,2.4vw,19px);line-height:1.5}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.screen{display:none}.screen.on{display:block}
h1{font-size:clamp(34px,9vw,60px);line-height:1.1;margin:18px 0 8px;text-align:center;letter-spacing:-1px;color:var(--yel);text-shadow:0 1px 0 var(--yel-d),0 2px 0 var(--yel-d),0 3px 0 var(--yel-d),0 4px 0 var(--yel-d),0 5px 0 var(--yel-d),0 6px 0 var(--yel-d),0 12px 14px rgba(0,0,0,.25);transform:perspective(600px) rotateX(10deg)}
.sub{text-align:center;color:var(--mute);margin:0 0 18px}
.stage{display:flex;justify-content:center;font-size:clamp(40px,12vw,64px);gap:6px;margin-top:6px}
.panel{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 10px 0 var(--line),0 24px 30px rgba(38,42,107,.2);transform:perspective(900px) rotateX(3deg);margin:18px 6px 24px}
.panel h2{margin:0 0 4px;font-size:1.2em;font-weight:400}
.big{font-size:clamp(54px,16vw,92px);line-height:1;text-align:center;color:var(--blue);text-shadow:0 4px 0 var(--blue-d)}
.big small{font-size:.35em;color:var(--mute);text-shadow:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;border-radius:14px;background:linear-gradient(var(--mint),var(--mint-d));border:3px solid var(--line);box-shadow:0 5px 0 var(--line);margin:18px 0 14px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--yel) 45%,var(--yel-d));border:3px solid var(--line);box-shadow:0 5px 0 var(--line);cursor:grab}
input[type=range]::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--yel) 45%,var(--yel-d));border:3px solid var(--line);box-shadow:0 5px 0 var(--line);cursor:grab}
.ticks{display:flex;justify-content:space-between;color:var(--mute);font-size:.85em}
.btn{font:inherit;color:#fff;background:var(--pink);border:3px solid var(--line);border-radius:18px;padding:12px 22px;box-shadow:0 7px 0 var(--pink-d),0 7px 0 3px var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s;margin-bottom:10px;min-height:48px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--pink-d),0 1px 0 3px var(--line)}
.btn.blue{background:var(--blue);box-shadow:0 7px 0 var(--blue-d),0 7px 0 3px var(--line)}
.btn.mint{background:var(--mint);color:#0d3b28;box-shadow:0 7px 0 var(--mint-d),0 7px 0 3px var(--line)}
.btn.yel{background:var(--yel);color:#4a3600;box-shadow:0 7px 0 var(--yel-d),0 7px 0 3px var(--line)}
.btn.wide{display:block;width:100%;font-size:1.5em;padding:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.file{margin-top:14px;text-align:center;font-size:.85em;color:var(--mute)}
.file label{text-decoration:underline;cursor:pointer}
.file input{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0}
.stat{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:6px 8px;text-align:center;box-shadow:0 5px 0 var(--line)}
.stat span{display:block;font-size:.8em;color:var(--mute)}
.stat b{font-weight:400;font-size:1.7em;line-height:1.1}
.stat.low b{color:var(--pink);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.bar{height:14px;border-radius:9px;border:3px solid var(--line);background:var(--card);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(var(--mint),var(--mint-d));transition:width 1s linear}
.q{text-align:center;padding:26px 14px}
.q p{margin:0;color:var(--mute)}
.q .front{font-size:clamp(30px,8.5vw,56px);line-height:1.25;margin:10px 0 6px;color:var(--ink);word-break:keep-all}
.q .blank{font-size:clamp(26px,7vw,44px);color:var(--pink);letter-spacing:2px}
.hint{min-height:2.2em;font-size:clamp(22px,6vw,34px);color:var(--blue);letter-spacing:3px;word-break:keep-all;margin-top:8px}
.ans{display:flex;gap:10px;flex-wrap:wrap}
.ans input{flex:1 1 220px;font:inherit;font-size:1.3em;padding:12px 16px;border:3px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);box-shadow:inset 0 4px 0 rgba(0,0,0,.08);min-height:56px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row .btn{flex:1 1 140px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{text-align:center}
.fb .pic{font-size:clamp(72px,22vw,128px);line-height:1.1;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.fb h3{margin:4px 0;font-size:1.7em;font-weight:400}
.fb.ok h3{color:var(--mint-d)}.fb.no h3{color:var(--pink)}
.full{font-size:1.35em;margin:6px 0}
.why{background:var(--bg2);border:3px dashed var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;text-align:left}
.mini{color:var(--mute)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:12px 0}
.res-grid div{background:var(--bg2);border:3px solid var(--line);border-radius:16px;padding:8px}
.res-grid b{display:block;font-size:1.8em;font-weight:400}
.rev{list-style:none;padding:0;margin:8px 0 0;max-height:300px;overflow:auto}
.rev li{padding:8px 4px;border-bottom:2px dotted var(--mute)}
.rev small{display:block;color:var(--mute)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.panel{padding:16px;margin:14px 2px 22px}.stat b{font-size:1.4em}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
<!-- 시작 -->
<section id="s-start" class="screen on">
  <div class="stage" aria-hidden="true"><span>🐯</span><span>🐸</span><span>🐋</span><span>🌾</span></div>
  <h1>속담 이어 맞추기</h1>
  <p class="sub">앞부분을 보고 뒷부분을 완성해 보세요!<br>시간 안에 많이 맞힐수록 점수가 쑥쑥 올라가요.</p>
  <div class="panel">
    <h2>⏱️ 게임 시간 정하기</h2>
    <div class="big"><span id="tv">120</span><small> 초</small></div>
    <input type="range" id="tr" min="30" max="300" step="10" value="120" aria-label="제한시간 (초)">
    <div class="ticks"><span>30초</span><span>300초</span></div>
  </div>
  <button class="btn wide" id="go">게임 시작!</button>
  <p class="file"><span id="cnt"></span><br><label for="csv">선생님 문제 파일(CSV) 불러오기</label><input type="file" id="csv" accept=".csv,text/csv"></p>
</section>

<!-- 게임 -->
<section id="s-game" class="screen">
  <div class="stats">
    <div class="stat"><span>⭐ 점수</span><b id="sc">0</b></div>
    <div class="stat"><span>✅ 맞힌 문제</span><b id="ok">0</b></div>
    <div class="stat" id="tbox"><span>⏳ 남은 시간</span><b id="tl">0</b></div>
  </div>
  <div class="bar"><i id="tb"></i></div>

  <div id="ask">
    <div class="panel q" id="qcard">
      <p>뒷부분을 완성해 보세요</p>
      <div class="front" id="front"></div>
      <div class="blank" id="blank" aria-hidden="true"></div>
      <div class="hint" id="hint" aria-live="polite"></div>
    </div>
    <div class="ans">
      <input id="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="뒷부분을 입력하세요" aria-label="정답 입력">
      <button class="btn" id="sub">확인</button>
    </div>
    <div class="row">
      <button class="btn yel" id="hb">💡 초성 힌트 (2번 남음)</button>
      <button class="btn blue" id="skip">잘 모르겠어요</button>
    </div>
  </div>

  <div id="fbk" class="panel fb" hidden></div>
</section>

<!-- 결과 -->
<section id="s-end" class="screen">
  <h1 id="etitle">끝!</h1>
  <p class="sub" id="emsg"></p>
  <div class="panel">
    <div class="res-grid">
      <div><span>⭐ 점수</span><b id="rs">0</b></div>
      <div><span>✅ 맞힌 문제</span><b id="rc">0</b></div>
      <div><span>🎯 정답률</span><b id="rr">0%</b></div>
    </div>
    <h2>다시 보기 (틀린 속담)</h2>
    <ul class="rev" id="rev"></ul>
    <h2 style="margin-top:14px">🙋 ‘잘 모르겠어요’로 넘긴 속담</h2>
    <ul class="rev" id="rev2"></ul>
  </div>
  <button class="btn wide yel" id="retry" hidden>넘긴 속담만 다시 풀기</button>
  <button class="btn wide mint" id="again">한 번 더 하기</button>
  <button class="btn wide blue" id="home">처음 화면으로</button>
</section>
</main>

<script>
// 앞구절|뒤구절|그림|해설  (교사 제공 CSV 50문항 기준)
const BASE=`가는 말이 고와야|오는 말이 곱다|💬😊|내가 먼저 고운 말을 해야 다른 사람도 고운 말로 대답해 줘요.
가는 날이|장날이다|🛒🎪|우연히 간 날이 하필 장이 서는 날이었다는 뜻이에요. 뜻하지 않은 일을 만났을 때 써요.
가랑비에|옷 젖는 줄 모른다|🌦️👕|가랑비도 오래 맞으면 옷이 젖듯, 작은 것도 쌓이면 큰 것이 돼요.
가재는|게 편이다|🦞🦀|모양이 비슷한 가재와 게처럼, 비슷한 처지의 사람끼리 서로 편들어 줘요.
개구리 올챙이 적|생각 못 한다|🐸🥚|형편이 나아지면 어려웠던 때를 잊고 잘난 척한다는 뜻이에요.
개천에서|용 난다|🏞️🐉|어려운 환경에서도 훌륭한 사람이 나올 수 있어요.
고래 싸움에|새우 등 터진다|🐋🦐|힘센 사람들끼리 싸우면 약한 사람이 피해를 봐요.
공든 탑이|무너지랴|🗼💪|정성을 다해 쌓은 것은 쉽게 무너지지 않아요.
구슬이 서 말이라도|꿰어야 보배|📿✨|좋은 재료가 많아도 잘 꿰어 완성해야 값져요.
금강산도|식후경|⛰️🍚|아무리 멋진 구경도 배부르게 먹은 뒤에 해야 즐거워요.
꿩 대신|닭|🐔|꼭 맞는 것이 없을 때 비슷한 것으로 대신해요.
남의 떡이|더 커 보인다|🍡👀|남의 것이 내 것보다 더 좋아 보여요.
낫 놓고 기역 자도|모른다|🌾📖|낫은 ㄱ 모양인데도 모를 만큼 글을 모르는 사람을 말해요.
누워서|침 뱉기|🛌💦|남을 욕하려다 결국 나에게 돌아와요.
다 된 밥에|재 뿌리기|🍚🌫️|거의 다 된 일을 망쳐 버려요.
달면 삼키고|쓰면 뱉는다|🍬😝|자기에게 이로우면 따르고, 해로우면 멀리해요.
닭 쫓던 개|지붕 쳐다보듯|🐕🐓🏠|애써 하던 일이 허사가 되어 멍하니 바라보게 돼요.
도둑이|제 발 저리다|🕵️🦶|잘못한 사람은 들키지 않았는데도 스스로 불안해해요.
돌다리도|두들겨 보고 건너라|🌉🔨|잘 아는 일도 조심해서 확인하며 해야 해요.
등잔 밑이|어둡다|🏮🌑|가까이 있는 것을 오히려 알아차리기 어려워요.
땅 짚고|헤엄치기|🏊🌍|아주 쉬운 일이라는 뜻이에요.
말 한마디에|천 냥 빚도 갚는다|🗣️💰|말을 잘하면 어려운 일도 풀 수 있어요.
목마른 사람이|우물 판다|🥵⛏️|필요한 사람이 먼저 나서서 일을 해요.
못된 송아지|엉덩이에 뿔 난다|🐮😈|나쁜 짓을 하는 사람이 더 못되게 굴어요.
믿는 도끼에|발등 찍힌다|🪓🦶|굳게 믿던 사람에게 배신을 당해요.
백지장도|맞들면 낫다|📄🤝|쉬운 일도 함께하면 더 쉬워요.
벼는 익을수록|고개를 숙인다|🌾🙇|훌륭한 사람일수록 겸손해요.
사공이 많으면|배가 산으로 간다|🚣⛵⛰️|참견하는 사람이 많으면 일이 잘못돼요.
소 잃고|외양간 고친다|🐄🏚️|일이 벌어진 뒤에야 대비해 봐야 소용없어요.
아니 땐 굴뚝에|연기 나랴|🔥🏠💨|원인이 없으면 결과도 없어요. 소문에도 까닭이 있다는 뜻이에요.
열 번 찍어|안 넘어가는 나무 없다|🪓🌳|끈기 있게 계속하면 이룰 수 있어요.
오르지 못할 나무는|쳐다보지도 마라|🌲🚫|이룰 수 없는 일은 욕심내지 말라는 뜻이에요.
우물 안|개구리|🐸🕳️|넓은 세상을 모르고 자기 생각만 옳다고 여겨요.
원숭이도|나무에서 떨어진다|🐒🌴|그 일을 잘하는 사람도 실수할 때가 있어요.
윗물이 맑아야|아랫물이 맑다|🏞️💧|윗사람이 바르게 행동해야 아랫사람도 따라 해요.
작은 고추가|맵다|🌶️🔥|몸집이 작아도 속이 알차고 야무져요.
재주는 곰이 넘고|돈은 왕서방이 받는다|🐻🎪💰|애쓴 사람과 이익을 보는 사람이 서로 달라요.
종로에서 뺨 맞고|한강에서 눈 흘긴다|😠🌊|화풀이를 엉뚱한 곳에서 해요.
티끌 모아|태산|✨⛰️|작은 것도 모으면 큰 것이 돼요.
팔은|안으로 굽는다|💪❤️|가까운 사람 편을 들게 돼요.
하늘의|별 따기|🌌⭐|아주 어려운 일이에요.
호랑이 굴에 가야|호랑이 새끼를 잡는다|🐯🕳️|위험을 무릅써야 큰 것을 얻을 수 있어요.
호랑이도 제 말 하면|온다|🐯👂|다른 사람 이야기를 하면 마침 그 사람이 나타나요.
세 살 버릇|여든까지 간다|👶🧓|어릴 때 몸에 밴 버릇은 늙어서도 고치기 어려워요.
아는 길도|물어 가라|🧭🙋|잘 아는 일도 확인하며 조심해요.
급할수록|돌아가라|⏰🐢|서두르면 실수하니 차근차근 해요.
낮말은 새가 듣고|밤말은 쥐가 듣는다|🐦🐭🌙|아무도 안 듣는 것 같아도 말은 조심해야 해요.
사촌이 땅을 사면|배가 아프다|🏡😖|다른 사람이 잘되면 샘이 나요.
하나를 보면|열을 안다|👀🔟|일부만 봐도 전체를 알 수 있어요.
백문이 불여일견|한 번 보는 것이 낫다|👂👁️|백 번 듣는 것보다 한 번 보는 것이 더 확실해요.`;

const $=id=>document.getElementById(id);
const parseBase=()=>BASE.split('\n').map(l=>{const [a,b,p,w]=l.split('|');return{a,b,p,w}});
let ALL=parseBase();
const norm=s=>s.replace(/[\s.,!?~'"’“”]/g,'');
const EXTRA={};ALL.forEach(q=>EXTRA[norm(q.a)]=q);
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho=c=>{const n=c.charCodeAt(0)-0xAC00;return n>=0&&n<11172?CHO[Math.floor(n/588)]:c};
const hintText=(t,lv)=>t.split(' ').map(w=>[...w].map((c,i)=>lv>=2&&i===0?c:cho(c)).join('')).join('   ');

let secs=120,left=0,score=0,right=0,tried=0,hints=0,queue=[],cur=null,state='idle',timer=null,wrong=[],skipped=[];

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
function updCount(){$('cnt').textContent='현재 문제 '+ALL.length+'개'}
updCount();
$('tr').oninput=e=>{secs=+e.target.value;$('tv').textContent=secs};

// CSV 불러오기 (앞구절,뒤구절[,해설,그림])
$('csv').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const rows=r.result.replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).slice(1);
    const out=rows.map(l=>{const p=l.split(',').map(x=>x.trim());const old=EXTRA[norm(p[0]||'')]||{};
      return{a:p[0],b:p[1],w:p[2]||old.w||'속담의 뜻을 선생님과 함께 이야기해 보세요.',p:p[3]||old.p||'💡'}}).filter(q=>q.a&&q.b);
    if(out.length){ALL=out;updCount();$('cnt').textContent+=' (새 파일 적용)'}
    else $('cnt').textContent='문제를 읽지 못했어요. 첫 줄은 앞구절,뒤구절 이어야 해요.';
  };
  r.readAsText(f,'utf-8');
};

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function start(list){
  score=0;right=0;tried=0;wrong=[];skipped=[];left=secs;queue=shuffle(list||ALL);
  $('sc').textContent=0;$('ok').textContent=0;
  show('s-game');paintTime();next();
  clearInterval(timer);timer=setInterval(tick,1000);
}
function tick(){
  if(state!=='play')return;
  left--;paintTime();
  if(left<=0)finish();
}
function paintTime(){
  $('tl').textContent=left;$('tb').style.width=Math.max(0,left/secs*100)+'%';
  $('tbox').classList.toggle('low',left<=10);
}
function next(){
  if(!queue.length){finish(true);return}
  cur=queue.pop();hints=0;state='play';$('blank').textContent=cur.b.split(' ').map(w=>'＿'.repeat([...w].length)).join('   ');
  $('front').textContent=cur.a;$('hint').textContent='';$('inp').value='';
  $('hb').disabled=false;$('hb').textContent='💡 초성 힌트 (2번 남음)';
  $('fbk').hidden=true;$('ask').hidden=false;
  $('inp').focus({preventScroll:true});
}
$('hb').onclick=()=>{
  if(state!=='play'||hints>=2)return;
  hints++;$('hint').textContent=hintText(cur.b,hints);
  const n=2-hints;$('hb').textContent=n?'💡 초성 힌트 ('+n+'번 남음)':'💡 힌트를 다 썼어요';$('hb').disabled=!n;
  $('inp').focus({preventScroll:true});
};
// 자연스러운 표현도 정답 처리: 어미·띄어쓰기·앞구절 포함 입력, 뒷부분 생략, 한 글자 오타 허용
const endRe=/(이다|한다|된다|이라|이야|예요|이에요|다|라|랴|나|요)$/;
function core(s,front){let t=norm(s),f=norm(front||'');if(f&&t.startsWith(f)&&t.length>f.length)t=t.slice(f.length);return t.replace(endRe,'')||t}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function match(v,b,a){
  if(norm(v)===norm(b))return true;
  const x=core(v,a),y=core(b);
  if(!x)return false;
  if(x===y)return true;
  const [s,l]=x.length<=y.length?[x,y]:[y,x];
  if(s.length>=3&&s.length/l.length>=.5&&(l.startsWith(s)||l.includes(s)&&s.length/l.length>=.6))return true;
  const lim=l.length>=8?2:l.length>=4?1:0;
  return lim>0&&lev(x,y)<=lim;
}
function submit(skip){
  if(state!=='play')return;
  const v=$('inp').value;
  if(!skip&&!norm(v)){$('qcard').classList.remove('shake');void $('qcard').offsetWidth;$('qcard').classList.add('shake');return}
  tried++;state='fb';
  const good=!skip&&match(v,cur.b,cur.a);
  $('ask').hidden=true;
  const f=$('fbk');f.hidden=false;f.className='panel fb '+(good?'ok':'no');
  const full='“'+cur.a+' '+cur.b+'”';
  if(good){
    const pt=[10,7,5][hints];score+=pt;right++;
    $('sc').textContent=score;$('ok').textContent=right;
    f.innerHTML='<div class="pic">'+cur.p+'</div><h3>🎉 정답이에요! +'+pt+'점</h3><div class="full">'+full+'</div><div class="mini">맞힌 문제 '+right+'개 · 남은 시간 '+left+'초</div>';
    boom();
    state='fb-ok';
    setTimeout(()=>{if(state==='fb-ok')next()},2000);
  }else{
    (skip?skipped:wrong).push(cur);
    f.innerHTML='<div class="pic">'+cur.p+'</div><h3>'+(skip?'괜찮아요, 같이 알아봐요!':'아쉬워요, 다시 확인해요')+'</h3>'
      +(skip?'':'<div class="mini">내가 쓴 답: '+esc(v)+'</div>')
      +'<div class="full">정답: '+full+'</div><div class="why">💬 '+esc(cur.w)+'</div>'
      +'<div class="mini">맞힌 문제 '+right+'개 · 남은 시간 '+left+'초 (읽는 동안 시간이 멈춰요)</div>'
      +'<button class="btn wide blue" id="nx" style="margin-top:14px">다음 문제</button>';
    $('nx').onclick=()=>{state='play';next()};$('nx').focus();
  }
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('sub').onclick=()=>submit(false);
$('skip').onclick=()=>submit(true);
$('inp').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)submit(false)};

function finish(all){
  clearInterval(timer);state='idle';
  const rate=tried?Math.round(right/tried*100):0;
  $('etitle').textContent=all?'모든 문제를 풀었어요!':'시간 끝!';
  $('emsg').textContent=rate>=80?'속담 박사님이에요! 🏆':rate>=50?'아주 잘했어요! 조금만 더 하면 박사!':'틀린 속담을 읽고 다시 도전해 봐요!';
  $('rs').textContent=score;$('rc').textContent=right+'개';$('rr').textContent=rate+'%';
  const li=l=>l.map(q=>'<li>'+q.p+' <b>'+esc(q.a+' '+q.b)+'</b><small>'+esc(q.w)+'</small></li>').join('');$('rev2').innerHTML=skipped.length?li(skipped):'<li>없어요! 👏</li>';$('retry').hidden=!skipped.length;$('rev').innerHTML=wrong.length?wrong.map(q=>'<li>'+q.p+' <b>'+esc(q.a+' '+q.b)+'</b><small>'+esc(q.w)+'</small></li>').join(''):'<li>틀린 속담이 없어요! 👏</li>';
  show('s-end');if(right)boom();
}
$('go').onclick=()=>start();$('again').onclick=()=>start();$('retry').onclick=()=>start(skipped.slice());$('home').onclick=()=>show('s-start');

// 폭죽
const cv=$('fx'),cx=cv.getContext('2d');let ps=[],raf=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',fit);fit();
function boom(){
  const cols=['#ffd23f','#ff6b8a','#3ddc97','#4d7cff','#ff9f43','#c56cf0'];
  for(let k=0;k<3;k++){
    const x=cv.width*(.2+Math.random()*.6),y=cv.height*(.2+Math.random()*.3);
    for(let i=0;i<45;i++){const a=Math.random()*6.283,s=2+Math.random()*6;
      ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:3+Math.random()*4,c:cols[i%6],l:60+Math.random()*30})}
  }
  if(!raf)raf=requestAnimationFrame(draw);
}
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps=ps.filter(p=>p.l>0);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.vx*=.99;p.l--;cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()});
  cx.globalAlpha=1;
  raf=ps.length?requestAnimationFrame(draw):0;
}
</script>
